input:not([type=checkbox]),select,textarea{width:100%;min-width:0;border:1px solid #d6e2e5;border-radius:8px;padding:10px;background:white;color:var(--ink);font-size:14px;font-weight:400}

function issues(rows){
const out=[];
rows.forEach(v=>{
if(!v.end)out.push({id:v.id,text:"Neužbaigtas apsilankymas"});
if(v.end&&!v.activities.length)out.push({id:v.id,text:"Nepažymėtos veiklos"});
if(v.end&&v.confirmation?.rev!==v.rev&&!v.noSignReason)out.push({id:v.id,text:"Trūksta gavėjo patvirtinimo"});
if(v.review==="returned")out.push({id:v.id,text:"Grąžinta taisyti"});
});
const all=S.visits.filter(v=>v.end),ids=new Set(rows.map(v=>v.id));
for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],b=all[j];if((ids.has(a.id)||ids.has(b.id))&&a.assistant===b.assistant&&new Date(a.start)<new Date(b.end)&&new Date(b.start)<new Date(a.end))out.push({id:ids.has(a.id)?a.id:b.id,text:"Asistento laiko persidengimas"});}

const point=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*330/r.height];};
canvas.onpointerdown=e=>{drawing=true;strokes.push([point(e)]);canvas.setPointerCapture(e.pointerId);};

function parseCSV(text){
text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],field="",quote=false;
for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++;}else quote=!quote;}else if(c===";"&&!quote){row.push(field);field="";}else if((c==="\n"||c==="\r")&&!quote){if(c==="\r"&&text[i+1]==="\n")i++;row.push(field);if(row.some(Boolean))rows.push(row);row=[];field="";}else field+=c;}
if(quote)throw Error("Neuždarytos kabutės.");row.push(field);if(row.some(Boolean))rows.push(row);return rows;
}
async function previewImport(file){
try{
const rows=parseCSV(await file.text()),headers=rows.shift()||[],kind=$("#import-kind").value,required=kind==="clients"?IMPORT_FIELDS:["id","name","email"],errors=[],data=[],seen=new Set();
required.forEach(k=>{if(!headers.includes(k))errors.push("Trūksta stulpelio "+k);});if(!rows.length)errors.push("Duomenų nėra.");if(rows.length>500)errors.push("Galima iki 500 eilučių.");
rows.slice(0,500).forEach((row,i)=>{
const x=Object.fromEntries(headers.map((k,j)=>[k,String(row[j]??"").trim()])),line=i+2;
if(!x.id||!x.name)errors.push(line+" eilutė: būtini id ir name.");if(seen.has(x.id))errors.push(line+" eilutė: pasikartojantis id.");seen.add(x.id);
if(kind==="assistants"){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x.email||""))errors.push(line+" eilutė: netinkamas el. paštas.");}
else{
if(!S.assistants.some(a=>a.id===x.assistant))errors.push(line+" eilutė: nežinomas asistentas.");
if(!GROUPS.includes(x.group)||!AGES.includes(x.age))errors.push(line+" eilutė: netinkama grupė.");
if(!x.contract||!x.decision||!x.address)errors.push(line+" eilutė: trūksta duomenų.");
["contractUntil","decisionDate","decisionUntil","disabilityUntil"].forEach(k=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(x[k]||"")||Number.isNaN(Date.parse(x[k]+"T12:00:00"))||new Date(x[k]+"T12:00:00").toLocaleDateString("sv-SE")!==x[k])errors.push(line+" eilutė: netinkama "+k+" data.");});
if(!x.hours)errors.push(line+" eilutė: trūksta valandų.");
x.hours=Number((x.hours||"").replace(",","."));
if(!Number.isFinite(x.hours)||x.hours<0||x.hours>744)errors.push(line+" eilutė: netinkamos valandos.");
if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(x.planFrom||""))errors.push(line+" eilutė: netinkamas plano mėnuo.");
x.allowed=(x.allowed||"").split("|").map(a=>a.trim()).filter(Boolean);
if(!x.allowed.length||x.allowed.some(a=>!ACTS.includes(a)))errors.push(line+" eilutė: netinkamos veiklos.");
}data.push(x);
});
importDraft={kind,data,errors};$("#import-preview").innerHTML='<div class="panel"><h2>Importo patikra</h2><p>'+data.length+' eilutės · '+errors.length+' klaidos</p>'+errors.map(e=>'<p class="notice bad">'+esc(e)+'</p>').join("")+'<table><thead><tr><th>ID</th><th>Vardas</th><th>Veiksmas</th></tr></thead><tbody>'+data.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.name)+'</td><td>'+esc(S[kind].some(r=>r.id===x.id)?"Atnaujinti":"Sukurti")+'</td></tr>').join("")+'</tbody></table><p><button data-a="applyimport" type="button" class="primary" '+(errors.length?"disabled":"")+'>Patvirtinti importą</button></p></div>';
}catch(e){message("Importo klaida: "+e.message,true);}
}

return true;
}

function makeZip(){
const readme="# SPIC asmeninės pagalbos demo\n\nTalpinimas: įkelkite index.html ir .nojekyll į GitHub saugyklos pagrindinį katalogą. Settings → Pages → Deploy from a branch → main → /(root).\n\n## Vizitų planavimas\nAsistentas planuoja tik gavėją, dieną ir atvykimo valandą. Numatoma trukmė ar pabaiga neregistruojama. Planą gali perkelti arba atšaukti pats asistentas. Koordinatorius ir administratorius mato komandos grafiką. Faktinė trukmė skaičiuojama paspaudus Pradėti ir Užbaigti.\n\n## Koregavimo prašymas\nAsistentas atidaro užbaigtą įrašą ir prašo leidimo koreguoti. Nurodo priežastį. Koordinatorius arba administratorius patvirtina arba atmeta. Tik patvirtintas prašymas atveria konkretaus įrašo konkrečią versiją. Pataisymas išsaugo seną versiją, sunaudoja leidimą, panaikina naujos versijos parašą ir grąžina įrašą patikrai. Koordinatorius gali ir pats grąžinti įrašą taisyti.\n\n## Dokumentai\nMokėjimo pranešimas pagal pateiktą šabloną. Paslaugų suteikimo aktas už pasirinktą laikotarpį automatiškai užpildo datas, pradžią, pabaigą, valandas ir bendrą sumą. Kokybės vertinimas, pastabos ir mėnesio dokumentų parašai pildomi popieriuje.\n\n## Ribos\nIšgalvoti duomenys. Vieno HTML failo vietinė demonstracija. Nėra tikros autentifikacijos, serverio kontrolės, kopijų ar apsaugoto audito. GPS, laiškai ir sinchronizavimas imituojami. Skaičiavimo formulę ir iš kliento šablono perkeltą tekstą prieš realų naudojimą patvirtina klientas. Nenaudoti tikrų asmens duomenų.\n\nExcel eksportas – CSV; PDF – naršyklės spausdinimas. HTML kopija išsaugo dabartinę demonstracijos būseną.\n";
const files=[["index.html",htmlFile()],["README.md",readme],[".nojekyll",""]];
const encoder=new TextEncoder(),parts=[],central=[];let offset=0;
const table=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0;});
const crc=data=>{let c=0xffffffff;for(const b of data)c=table[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;};
const block=n=>{const a=new Uint8Array(n);return[a,new DataView(a.buffer)];};
for(const [name,text]of files){
const n=encoder.encode(name),data=encoder.encode(text),sum=crc(data),[p,l]=block(30);
l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x800,true);l.setUint16(12,33,true);l.setUint32(14,sum,true);l.setUint32(18,data.length,true);l.setUint32(22,data.length,true);l.setUint16(26,n.length,true);parts.push(p,n,data);
const [q,c]=block(46);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,33,true);c.setUint32(16,sum,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,n.length,true);c.setUint32(42,offset,true);central.push(q,n);offset+=p.length+n.length+data.length;
}
const [end,e]=block(22);e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,central.reduce((s,b)=>s+b.length,0),true);e.setUint32(16,offset,true);
download("SPIC-demo-su-planavimu-ir-prasymais.zip",new Blob([...parts,...central,end]),"application/zip");
}

<script>
(() => {
  const contentRange = document.createRange();
  let previousMeasurement = null;
  let heightReportTimer = null;
  const reportHeight = () => {
    const bodyChildren = Array.from(document.body.children).filter(
      (element) =>
        element.tagName !== "SCRIPT" &&
        element.tagName !== "STYLE" &&
        element.getAttribute("role") !== "tooltip",
    );
    const bodyStyle = globalThis.getComputedStyle(document.body);
    const contentWidth = Math.max(
      0,
      Math.round(
        globalThis.innerWidth -
          parseFloat(bodyStyle.paddingLeft) -
          parseFloat(bodyStyle.paddingRight),
      ),
    );
    let contentHeight;
    if (bodyChildren.length === 0) {
      contentRange.selectNodeContents(document.body);
      contentHeight = contentRange.getBoundingClientRect().height;
    } else if (bodyChildren.length === 1) {
      const [bodyChild] = bodyChildren;
      const childRect = bodyChild.getBoundingClientRect();
      // Child margins can collapse above the root without adding to its height.
      // The host adds body padding separately.
      contentHeight =
        Math.max(bodyChild.scrollHeight, childRect.height) +
        Math.max(
          0,
          childRect.top -
            document.body.getBoundingClientRect().top -
            parseFloat(bodyStyle.paddingTop),
        );
    } else {
      const bodyTop = document.body.getBoundingClientRect().top;
      contentHeight = Math.max(
        ...bodyChildren.map(
          (bodyChild) => bodyChild.getBoundingClientRect().bottom - bodyTop,
        ),
      );
    }
    const viewportHeight = globalThis.innerHeight;
    const previous = previousMeasurement;
    previousMeasurement = { contentHeight, contentWidth, viewportHeight };
    if (
      previous != null &&
      contentWidth === previous.contentWidth &&
      contentHeight - previous.contentHeight ===
        viewportHeight - previous.viewportHeight
    ) {
      return;
    }

    void globalThis.openai
      .callTool(
        "__codex_inline_visualization_height__",
        { height: contentHeight, width: contentWidth },
      )
      .catch(() => {});
  };
  const scheduleHeightReport = () => {
    if (heightReportTimer != null) {
      return;
    }
    // Offscreen frames can suspend animation callbacks while their content loads.
    heightReportTimer = globalThis.setTimeout(() => {
      heightReportTimer = null;
      reportHeight();
    }, 0);
  };

  const resizeObserver = new ResizeObserver(scheduleHeightReport);
  const observeBodyChildren = () => {
    for (const element of document.body.children) {
      resizeObserver.observe(element);
    }
  };
  resizeObserver.observe(document.body);
  observeBodyChildren();
  new MutationObserver(() => {
    observeBodyChildren();
    scheduleHeightReport();
  }).observe(document.body, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ["style", "class", "height", "width"],
  });
  globalThis.addEventListener("resize", scheduleHeightReport);
  reportHeight();
})();
</script>

<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async="" src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
