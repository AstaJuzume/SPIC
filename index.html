<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIC · Paslaugų valdymas</title>
<style>
:root{--bg:#f3f6f8;--paper:#fff;--ink:#18313b;--muted:#6b7e87;--line:#e1e9ed;--brand:#166b69;--soft:#e8f4f1;--nav:#15383f;--warn:#9a641b;--warnbg:#fff4dd;--bad:#a84242;--badbg:#fff0ed;--blue:#426897}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer;background:white;color:var(--ink);padding:9px 13px;border:1px solid var(--line);border-radius:9px}
button:hover{border-color:var(--brand);background:#f5faf9}
button.primary{background:var(--brand);color:white;border-color:var(--brand)}
button.primary:hover{background:#105957}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
a{color:var(--brand)}
h1,h2,h3,p{margin-top:0}
h1{font-size:27px;line-height:1.25;letter-spacing:-.6px;margin-bottom:8px}
h2{font-size:18px;margin-bottom:15px}
h3{font-size:15px;margin-bottom:8px}
p{margin-bottom:10px}
small,.muted{color:var(--muted)}
small{font-size:12px}
.shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:780px}
aside{background:var(--nav);color:#e7f3f3;padding:25px 14px;display:flex;flex-direction:column;gap:5px}
.wordmark{display:flex;align-items:center;gap:11px;padding:0 9px 25px}
.symbol{background:#c3e5d7;color:#164d48;width:39px;height:39px;border-radius:13px;display:grid;place-items:center;font-size:23px;font-weight:600}
.wordmark strong{font-size:24px;letter-spacing:1px}
.wordmark small{color:#b8cfd0;font-size:11px;display:block}
aside button{text-align:left;background:transparent;border-color:transparent;color:#c5d6d8;border-radius:9px;padding:11px 12px}
aside button:hover,aside button.active{background:#285158;border-color:transparent;color:white}
aside .nav-separator{margin:17px 12px 6px;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#96b6b9}
aside .bottom{margin-top:auto;padding:25px 10px 0;color:#9cbabf;font-size:11px}
header{background:white;border-bottom:1px solid var(--line);padding:15px 25px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header select{width:auto;max-width:220px}
main{padding:28px;max-width:1500px;margin:auto}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.push{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:20px}
.equal{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel,.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}
.panel{margin-top:20px}
.metric .value{font-size:30px;font-weight:600;line-height:1.3;letter-spacing:-.7px;margin:9px 0 5px}
.metric small{display:block}
.metric .icon{color:var(--brand)}
.hero{background:linear-gradient(110deg,#153c46,#22696b);color:white;border-radius:15px;padding:25px;margin-bottom:22px}
.hero small,.hero .muted{color:#c3dcdc}
.hero h1{font-size:26px}
.hero button{border-color:#63898d;background:transparent;color:white}
.hero button.primary{background:#d7eee2;color:#163e3d;border-color:#d7eee2}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--brand);padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.blue{background:#edf2fb;color:var(--blue)}
.tag.grey{background:#eef2f4;color:#5c7079}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0;min-width:0;font-size:12px;font-weight:600}
input:not([type=checkbox]),select,textarea{width:100%;background:white;color:var(--ink);border:1px solid #d8e3e7;border-radius:8px;padding:10px;font-size:14px;font-weight:400;min-width:0}
textarea{min-height:82px;resize:vertical}
input[type=checkbox]{accent-color:var(--brand);width:18px;height:18px}
.check{display:flex;align-items:center;gap:9px;padding:10px 0}
.list-row{padding:15px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.avatar{width:39px;height:39px;flex-shrink:0;border-radius:12px;background:#ebf1f3;color:#4b6873;display:grid;place-items:center;font-weight:600}
.avatar.round{border-radius:50%;background:#e6f1ec;color:var(--brand)}
.progress{height:7px;background:#edf2f4;border-radius:10px;overflow:hidden;margin:9px 0}
.progress span{display:block;background:var(--brand);height:100%;border-radius:10px}
.progress.warn span{background:#ca943e}
.notice{border-radius:9px;background:var(--soft);padding:12px 14px;margin:13px 0;font-size:13px}
.notice.warn{background:var(--warnbg);color:#775321}
.notice.bad{background:var(--badbg);color:var(--bad)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;min-width:870px}
.day{background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:220px}
.day.today{background:#edf7f3;border-color:#bfd7ce}
.day-title{display:flex;justify-content:space-between;font-size:12px;margin-bottom:14px}
.day-title strong{font-size:17px}
.event{display:block;width:100%;text-align:left;padding:9px;background:white;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:7px;margin:8px 0;font-size:11px}
.event strong{display:block;font-size:12px;margin:4px 0}
.event small{font-size:10px}
.event.cancelled{border-left-color:#bd8585;opacity:.7}
.phone{max-width:430px;margin:20px auto;background:#f5f8f8;border:1px solid #d6e3e5;border-radius:25px;overflow:hidden;box-shadow:0 15px 45px #173d3c10}
.phone-head{background:white;padding:22px;border-bottom:1px solid var(--line)}
.phone-body{padding:18px}
.phone .panel{padding:17px;margin-top:13px}
.phone button.primary{padding:13px}
.phone .primary.wide{width:100%}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.step{font-size:11px;background:#eef3f5;color:#6c7e86;padding:6px 10px;border-radius:7px}
.step.done{background:var(--soft);color:var(--brand)}
.clock{font-size:35px;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums}
canvas{display:block;background:#fff;width:100%;height:165px;border:1px dashed #9db8b1;border-radius:10px;touch-action:none}
.priority{display:flex;gap:4px;flex-wrap:wrap}
.priority button{font-size:11px;padding:6px 9px}
.priority button.active{background:var(--brand);border-color:var(--brand);color:white}
dialog{border:1px solid var(--line);border-radius:17px;padding:24px;width:min(650px,94vw);max-height:90vh;overflow:auto;color:var(--ink);box-shadow:0 20px 80px #102d3d30}
dialog::backdrop{background:#15313e66}
dialog .equal{gap:14px}
#message{padding:0 28px;color:var(--brand);font-size:13px}
#message:not(:empty){padding-top:14px}
footer{padding:15px 27px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:white}
.kicker{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:600;color:var(--brand);margin-bottom:8px}
.divider{height:1px;background:var(--line);margin:15px 0}
.validation button{text-align:left;display:block;width:100%;margin:6px 0}
footer button{font-size:11px;padding:7px 10px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.shell{grid-template-columns:190px minmax(0,1fr)}main{padding:22px}}
@media(max-width:720px){.shell{display:block}aside{padding:12px;display:block}.wordmark{padding:0 0 10px}.wordmark small,aside .bottom,aside .nav-separator{display:none}aside button{display:inline-block;padding:8px;font-size:12px;margin:2px}.equal{grid-template-columns:1fr}main{padding:16px}header{padding:12px}.grid{gap:10px}.metric{padding:15px}.metric .value{font-size:25px}.push{margin-left:0}.calendar{min-width:0;grid-template-columns:1fr}.day{min-height:0}.event{font-size:12px}.phone{border-radius:17px}.hero{padding:20px}h1{font-size:24px}}
@media print{aside,header,footer,button,#message,.filters,.no-print{display:none!important}.shell{display:block}body,main{background:white;color:black}main{padding:0}.panel{break-inside:avoid;box-shadow:none}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="shell">
<aside id="sidebar"></aside>
<div>
<header>
<div><strong>Paslaugų valdymas</strong><br><small>Darbo organizavimas ir paslaugų apskaita</small></div>
<span class="tag grey">DEMO</span>
<div class="row push">
<button id="net"></button>
<label class="row" style="font-size:12px">Vaizdas
<select id="role"><option value="admin">Koordinatorius</option><option value="worker">Darbuotojas</option></select>
</label>
<div class="avatar round">SP</div>
</div>
</header>
<div id="message" role="status" aria-live="polite"></div>
<main id="main"></main>
<footer>
<span>Išgalvoti duomenys · sinchronizavimas ir teisės imituojami</span>
<button data-act="zip">Atsisiųsti GitHub paketą</button>
<button data-act="html">Atsisiųsti HTML</button>
<button data-act="reset">Atkurti demonstraciją</button>
</footer>
</div>
</div>
<dialog id="modal"></dialog>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),main=$("#main"),modal=$("#modal");
const TODAY=new Date().toLocaleDateString("sv-SE");
const iso=d=>d.toLocaleDateString("sv-SE");
const shift=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);};
const monday=s=>{const d=new Date(s+"T12:00:00");return shift(s,-((d.getDay()+6)%7));};
const stamp=(date,time)=>new Date(date+"T"+time+":00").toISOString();
const time=s=>s?new Date(s).toLocaleTimeString("lt-LT",{hour:"2-digit",minute:"2-digit"}):"—";
const dt=s=>s?new Date(s).toLocaleString("lt-LT"):"—";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>n.split(" ").map(x=>x[0]).slice(0,2).join("");
const fmt=n=>Number(n).toLocaleString("lt-LT",{maximumFractionDigits:1});
const TYPES=["Pagalba į namus","Asmeninė pagalba"];
const ACTIVITIES=["Apsipirkimas","Maisto ruošimas","Namų tvarkymas","Asmens higiena","Palydėjimas","Bendravimas"];
const topics=[
["Vizitų laiko fiksavimas","Pradžia, pabaiga, trukmė. Kas gali taisyti pamirštą ar klaidingą laiką?"],
["Paslaugų rūšys ir veiklos","Patvirtinti paslaugų bei veiklų klasifikatorių. Ar reikia atskiros kiekvienos veiklos trukmės?"],
["Paslaugų gavėjų kortelės","Kontaktai, atstovas, darbuotojas ir paslaugų istorija. Kokie laukai būtini?"],
["Paslaugų planas ir limitai","Mėnesio valandos, galiojimo terminas, plano ir fakto kontrolė."],
["Savaitės grafikas","Pasikartojantys vizitai, darbuotojų pakeitimas ir perkėlimas."],
["Neįvykę vizitai","Kliento nėra, atsisakė, vizitas atšauktas. Ar reikia papildomų priežasčių?"],
["Kliento patvirtinimas","Parašas ekrane, atstovo patvirtinimas, negalėjimo pasirašyti atvejai ir teisiniai reikalavimai."],
["Darbas be interneto","Įrenginiai, laikotarpis be ryšio, duomenų konfliktai, sinchronizavimas."],
["Mėnesio ataskaita ir patikra","Reikalingos formos, trūkstami patvirtinimai, persidengimai ir tvirtinimo eiga."],
["Excel ir PDF eksportas","Pateikti naudojamus ataskaitų šablonus ir reikalingus eksportuoti laukus."],
["Teisės, auditas ir saugumas","Matomumas, keitimai, saugojimo vieta bei terminai, kopijos ir incidentų valdymas."],
["Licencijos ir bendros išlaidos","Tikslus naudotojų skaičius, įrenginiai, diegimas, priežiūra ir atnaujinimai."],
["Pilotas, garantija ir palaikymas","Pilotinės grupės dydis, terminai, mokymai ir reagavimo laikas."],
["Duomenų ir sistemos perdavimas","Eksporto formatas, priedai, parašai, programinis kodas ir perdavimo sąlygos."],
["Transporto paslaugos – galimas kitas etapas","Ar šio projekto apimtyje reikia transporto užsakymų ir jų apskaitos?"]
];
function defaults(){
const clients=[
{id:"c1",name:"Ona Pavyzdinė",address:"Demonstracinė g. 12, Klaipėda",phone:"+370 600 00001",contact:"Dukra Dalia · demonstracinis kontaktas",worker:"w1",type:TYPES[0],hours:40,valid:shift(TODAY,180),note:"Vizitai darbo dienomis. Prieš atvykstant paskambinti."},
{id:"c2",name:"Jonas Pavyzdinis",address:"Pavyzdžio g. 8, Klaipėda",phone:"+370 600 00002",contact:"Atstovas Petras · demonstracinis kontaktas",worker:"w1",type:TYPES[1],hours:32,valid:shift(TODAY,90),note:"Pagrindinės veiklos – palydėjimas ir pagalba kasdienėje veikloje."},
{id:"c3",name:"Elena Demonstracinė",address:"Sutartinė g. 3, Klaipėda",phone:"+370 600 00003",contact:"Sūnus Tomas · demonstracinis kontaktas",worker:"w2",type:TYPES[0],hours:24,valid:shift(TODAY,120),note:"Maisto ruošimas ir apsipirkimas."},
{id:"c4",name:"Petras Pavyzdinis",address:"Bandomoji g. 5, Klaipėda",phone:"+370 600 00004",contact:"Kontaktinis asmuo Rūta",worker:"w3",type:TYPES[1],hours:36,valid:shift(TODAY,150),note:"Individualus savaitės grafikas."}
];
const visit=(id,client,worker,date,planned,status="Planuojamas",extra={})=>({id,client,worker,date,planned,duration:60,type:clients.find(c=>c.id===client).type,status,start:null,end:null,activities:[],note:"",signature:[],sync:true,...extra});
return {version:4,online:true,queue:[],audit:[],meeting:"",
workers:[{id:"w1",name:"Rasa Kazlauskienė",role:"Individualios priežiūros darbuotoja"},{id:"w2",name:"Ieva Petrauskienė",role:"Individualios priežiūros darbuotoja"},{id:"w3",name:"Tomas Jonaitis",role:"Asmeninis asistentas"}],
clients,
visits:[
visit("v1","c1","w1",TODAY,"09:00"),
visit("v2","c2","w1",TODAY,"11:00"),
visit("v3","c3","w2",TODAY,"10:00","Patvirtintas",{start:stamp(TODAY,"10:00"),end:stamp(TODAY,"11:00"),activities:["Maisto ruošimas"],confirmation:"Demonstracinis patvirtinimas",confirmedAt:stamp(TODAY,"11:00")}),
visit("v4","c4","w3",TODAY,"13:00","Baigtas",{start:stamp(TODAY,"13:00"),end:stamp(TODAY,"14:00"),activities:["Palydėjimas"]}),
visit("v5","c1","w1",shift(TODAY,1),"09:00"),
visit("v6","c2","w1",shift(TODAY,2),"11:00"),
visit("v7","c3","w2",shift(TODAY,1),"10:00"),
visit("v8","c1","w1",shift(TODAY,-2),"09:00","Patvirtintas",{start:stamp(shift(TODAY,-2),"09:00"),end:stamp(shift(TODAY,-2),"10:30"),activities:["Apsipirkimas","Namų tvarkymas"],confirmation:"Demonstracinis patvirtinimas",confirmedAt:stamp(shift(TODAY,-2),"10:30")}),
visit("v9","c2","w1",shift(TODAY,-1),"11:00","Neįvyko",{reason:"Kliento nėra",note:"Sutarti kitą laiką."})
],
trips:[{id:"t1",client:"c2",date:shift(TODAY,1),time:"10:00",from:"Pavyzdžio g. 8",to:"Demonstracinė gydymo įstaiga",worker:"w3",km:8,note:"Reikalinga palyda.",status:"Planuojamas"}],
decisions:topics.map(x=>({name:x[0],priority:"Aptarti",note:""}))
};
}
let S=defaults(),role="admin",tab="dashboard",worker="w1",selected=null,week=monday(TODAY),calWorker="",search="",report={month:TODAY.slice(0,7),worker:"",client:""},backupPending=false;
try{const old=window.SPIC_INITIAL||JSON.parse(localStorage.getItem("spic-v4")||"null");if(old?.version===4&&Array.isArray(old.visits)&&Array.isArray(old.clients))S=old;}catch(e){}
function save(){try{localStorage.setItem("spic-v4",JSON.stringify(S));}catch(e){backupPending=true;}}
const client=id=>S.clients.find(x=>x.id===id);
const cn=id=>client(id)?.name||"Paslaugos gavėjas";
const wn=id=>S.workers.find(x=>x.id===id)?.name||"Darbuotojas";
const minutes=v=>v.start&&v.end?Math.max(0,Math.round((new Date(v.end)-new Date(v.start))/60000)):0;
const hours=(id,month)=>S.visits.filter(v=>v.client===id&&v.end&&v.date.startsWith(month)).reduce((a,v)=>a+minutes(v)/60,0);
const visibleVisits=()=>S.visits.filter(v=>role!=="worker"||v.worker===worker);
function log(action,target){S.audit.unshift({at:new Date().toISOString(),user:role==="admin"?"Koordinatorius":wn(worker),action,target});S.audit=S.audit.slice(0,300);}
function mutate(action,target,obj,kind="visit"){
log(action,target);
if(obj){obj.sync=S.online;const key=kind+":"+obj.id;if(!S.online&&!S.queue.includes(key))S.queue.push(key);}
save();
}
function msg(t,error=false){$("#message").textContent=t;$("#message").style.color=error?"var(--bad)":"var(--brand)";}
function opts(arr,value,blank){return (blank?'<option value="">'+esc(blank)+'</option>':"")+arr.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===value?"selected":"")+'>'+esc(x.name)+'</option>').join("");}
function choices(arr,value){return arr.map(x=>'<option '+(x===value?"selected":"")+'>'+esc(x)+'</option>').join("");}
function btn(text,act,id="",cls=""){return '<button class="'+cls+'" data-act="'+act+'" data-id="'+esc(id)+'">'+text+'</button>';}
function head(title,sub,actions=""){return '<div class="row between"><div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div><div class="row">'+actions+'</div></div>';}
function badge(v){const cls=v.status==="Vyksta"?"blue":v.status==="Baigtas"?"warn":["Neįvyko","Atšauktas"].includes(v.status)?"bad":v.status==="Planuojamas"?"grey":"";return '<span class="tag '+cls+'">'+esc(v.status)+'</span>'+(!v.sync?' <span class="tag warn">Laukia siuntimo</span>':"");}
function avatar(name){return '<div class="avatar">'+esc(initials(name))+'</div>';}
function visitRow(v){return '<div class="list-row row">'+avatar(cn(v.client))+'<div><strong>'+esc(cn(v.client))+'</strong><br><small>'+esc(v.date)+' · '+esc(v.planned)+' · '+esc(wn(v.worker))+'</small><div style="margin-top:5px">'+badge(v)+'</div></div><div class="push">'+btn("Atidaryti →","visit",v.id)+'</div></div>';}
function metric(label,value,sub){return '<div class="metric"><small>'+label+'</small><div class="value">'+value+'</div><small>'+sub+'</small></div>';}
function render(){
const items=[["dashboard","◫","Apžvalga"],["day","◷","Darbuotojo diena"],["calendar","▦","Savaitės grafikas"],["visits","☷","Vizitų registras"],["clients","◇","Paslaugų gavėjai"],["workers","♧","Darbuotojai"],["reports","▤","Ataskaitos"],["audit","↻","Veiksmų istorija"],["transport","↗","Transportas · plėtra"],["meeting","✓","Demo aptarimas"]];
const allowed=role==="worker"?["day","clients"]:items.map(x=>x[0]);
if(!allowed.includes(tab))tab="day";
$("#sidebar").innerHTML='<div class="wordmark"><div class="symbol">S</div><div><strong>SPIC</strong><small>Paslaugos arčiau žmogaus</small></div></div>'+items.filter(x=>allowed.includes(x[0])).map(x=>(x[0]==="transport"?'<div class="nav-separator">Plėtra ir susitikimas</div>':"")+'<button data-act="nav" data-id="'+x[0]+'" class="'+(tab===x[0]?"active":"")+'">'+x[1]+'　'+x[2]+'</button>').join("")+'<div class="bottom">Socialinių paslaugų informacijos centras<br><br>Interaktyvi sprendimo vizija</div>';
$("#role").value=role;
$("#net").textContent=(S.online?"● Ryšys įjungtas":"○ Be interneto")+" · "+S.queue.length+" laukia";
if(selected){visitDetail();return;}
({dashboard,day,calendar,visits,clients,workers,reports,audit,transport,meeting}[tab])();
}
function dashboard(){

let strokes=[],drawing=false,signCanvas=null;
function wireSignature(v){
signCanvas=$("#signature");signCanvas.width=900;signCanvas.height=330;strokes=JSON.parse(JSON.stringify(v.signature||[]));paintSign();
if(v.status==="Patvirtintas")return;
const point=e=>{const r=signCanvas.getBoundingClientRect();return [(e.clientX-r.left)*900/r.width,(e.clientY-r.top)*330/r.height];};
signCanvas.onpointerdown=e=>{drawing=true;strokes.push([point(e)]);signCanvas.setPointerCapture(e.pointerId);};
signCanvas.onpointermove=e=>{if(drawing){strokes[strokes.length-1].push(point(e));paintSign();}};
signCanvas.onpointerup=()=>drawing=false;signCanvas.onpointercancel=()=>drawing=false;
}
function paintSign(){if(!signCanvas)return;const ctx=signCanvas.getContext("2d");ctx.clearRect(0,0,900,330);ctx.strokeStyle="#183e3b";ctx.lineWidth=3;ctx.lineCap="round";strokes.forEach(line=>{if(!line.length)return;ctx.beginPath();ctx.moveTo(...line[0]);line.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();});}

function issues(rows){
const result=[],now=Date.now();
rows.forEach(v=>{
if(v.end&&v.status!=="Patvirtintas")result.push({id:v.id,type:"Trūksta patvirtinimo",detail:cn(v.client)+" · "+v.date});
if(v.start&&!v.end)result.push({id:v.id,type:"Neužbaigtas vizitas",detail:cn(v.client)+" · "+v.date});
if(v.end&&!v.activities.length)result.push({id:v.id,type:"Nepažymėtos veiklos",detail:cn(v.client)+" · "+v.date});
if(v.status==="Planuojamas"&&new Date(v.date+"T"+v.planned).getTime()+v.duration*60000<now)result.push({id:v.id,type:"Praėjęs planuotas laikas",detail:cn(v.client)+" · "+v.date});
});
const completed=S.visits.filter(v=>v.start&&v.end);
const wanted=new Set(rows.map(v=>v.id));
for(let i=0;i<completed.length;i++)for(let j=i+1;j<completed.length;j++){
const a=completed[i],b=completed[j];
if((wanted.has(a.id)||wanted.has(b.id))&&a.worker===b.worker&&new Date(a.start)<new Date(b.end)&&new Date(b.start)<new Date(a.end))result.push({id:wanted.has(a.id)?a.id:b.id,type:"Laiko persidengimas",detail:wn(a.worker)+" · "+cn(a.client)+" / "+cn(b.client)});
}
return result;
}

document.addEventListener("submit",e=>{
const form=e.target.closest("[data-form]");if(!form)return;
e.preventDefault();const f=Object.fromEntries(new FormData(form)),kind=form.dataset.form;
if(kind==="visit"){
let v=S.visits.find(x=>x.id===f.id);
const count=v?1:Number(f.repeat||1);
if(v&&v.start){msg("Pradėto vizito planuoti iš naujo negalima.",true);return;}
for(let i=0;i<count;i++){
const data={client:f.client,worker:f.worker,date:shift(f.date,i*7),planned:f.planned,duration:Number(f.duration),type:f.type,note:f.note,status:"Planuojamas"};
if(v)Object.assign(v,data);else{v={id:uid(),start:null,end:null,activities:[],signature:[],sync:S.online,...data};S.visits.push(v);}
mutate(f.id?"Vizitas perkeltas / perskirtas":"Suplanuotas vizitas",cn(v.client),v);v=null;
}
}else if(kind==="client"){
let c=client(f.id);const data={...f,hours:Number(f.hours)};delete data.id;
if(c)Object.assign(c,data);else{c={id:uid(),...data};S.clients.push(c);}
mutate("Atnaujinta gavėjo kortelė ir planas",c.name,c,"client");
}else if(kind==="worker"){
let w=S.workers.find(x=>x.id===f.id);
if(w)Object.assign(w,{name:f.name,role:f.role});else{w={id:uid(),name:f.name,role:f.role};S.workers.push(w);}
mutate("Atnaujinta darbuotojo kortelė",w.name,w,"worker");
}else if(kind==="fail"){
const v=S.visits.find(x=>x.id===f.id);
v.status=f.reason==="Atšauktas įstaigos"?"Atšauktas":"Neįvyko";v.reason=f.reason;v.note=f.note;
mutate("Užregistruotas neįvykęs vizitas",cn(v.client),v);
}else if(kind==="trip"){
const t={id:uid(),...f,km:Number(f.km),status:"Planuojamas"};S.trips.push(t);mutate("Sukurtas transporto užsakymas",cn(t.client),t,"trip");
}
modal.close();render();msg("Pakeitimai išsaugoti prototipe.");
});

if(!v.activities.length){msg("Pažymėkite suteiktas veiklas.",true);return;}
v.signature=JSON.parse(JSON.stringify(strokes));v.signer=name;v.confirmation=$("#signer-type").value+" · "+name;v.confirmedAt=new Date().toISOString();v.status="Patvirtintas";mutate("Paslauga patvirtinta parašu",cn(v.client),v);render();msg("Patvirtinimas išsaugotas"+(S.online?".":" įrenginyje. Laukia siuntimo."));
}
if(act==="priority"){S.decisions[Number(id)].priority=b.dataset.value;save();render();}
if(act==="newtrip")tripForm();
if(act==="finishtrip"){const t=S.trips.find(x=>x.id===id);t.status="Įvykdytas";mutate("Transporto užsakymas įvykdytas",cn(t.client),t,"trip");render();}
if(act==="reportcsv")csv("SPIC-ataskaita-"+report.month+".csv",[["Data","Planuotas laikas","Gavėjas","Darbuotojas","Paslaugos rūšis","Veiklos","Pradžia","Pabaiga","Trukmė min.","Būsena","Neįvykimo priežastis","Patvirtino"],...reportRows().map(v=>[v.date,v.planned,cn(v.client),wn(v.worker),v.type,v.activities.join(", "),time(v.start),time(v.end),minutes(v),v.status,v.reason||"",v.signer||v.confirmation||""])]);
if(act==="decisionscsv")csv("SPIC-susitikimo-sprendimai.csv",[["Funkcionalumas","Sprendimas","Pastabos"],...S.decisions.map(d=>[d.name,d.priority,d.note]),["Kitas žingsnis","",S.meeting]]);
if(act==="print"){try{window.print();}catch(e){msg("Spausdinkite atsisiųstą HTML naršyklėje.",true);}}
if(act==="html")download("index.html",htmlFile(),"text/html;charset=utf-8");
if(act==="zip")githubZip();
if(act==="reset"){
if(!window.confirm("Atkurti pradinius duomenis? Vizitų pakeitimai ir susitikimo pastabos bus pašalinti."))return;
S=defaults();selected=null;tab=role==="worker"?"day":"dashboard";save();render();msg("Demonstracija atkurta.");
}

$("#net").onclick=()=>{
S.online=!S.online;
if(S.online){
const n=S.queue.length;
S.queue.forEach(key=>{const [kind,id]=key.split(":");const arr=kind==="visit"?S.visits:kind==="client"?S.clients:kind==="worker"?S.workers:S.trips;const obj=arr.find(x=>x.id===id);if(obj)obj.sync=true;});
S.queue=[];log("Demo sinchronizavimas",n+" pakeitimų");msg("Ryšys atkurtas. "+n+" pakeitimų pažymėti kaip sinchronizuoti. Siuntimas į serverį imituojamas.");
}else{log("Demo ryšys išjungtas","Darbas be interneto");msg("Ryšio imitacija išjungta. Pakeitimai kaupiami įrenginyje.");}

function download(name,data,type){
try{const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);msg("Paruoštas atsisiuntimas: "+name+". Jei failas nepasirodo, peržiūros aplinka riboja atsisiuntimus.");}
catch(e){msg("Šioje peržiūroje atsisiuntimas neprieinamas.",true);}
}
function csv(name,rows){
const cell=x=>{let s=String(x??"");if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
download(name,"\uFEFF"+rows.map(r=>r.map(cell).join(";")).join("\r\n"),"text/csv;charset=utf-8");
}
function htmlFile(){
const doc=document.documentElement.cloneNode(true);
doc.querySelectorAll("[data-seed]").forEach(x=>x.remove());
doc.querySelector("#main").innerHTML="";doc.querySelector("#sidebar").innerHTML="";doc.querySelector("#message").textContent="";doc.querySelector("#modal").innerHTML="";doc.querySelector("#modal").removeAttribute("open");
const s=document.createElement("script");s.dataset.seed="1";s.textContent="window.SPIC_INITIAL="+JSON.stringify(S).replace(/</g,"\\u003c")+";";doc.querySelector("head").appendChild(s);
return "<!doctype html>\n"+doc.outerHTML;
}
function githubZip(){
const files=[
["index.html",htmlFile()],
[".nojekyll",""],
["README.md","# SPIC paslaugų valdymo prototipas\n\n## GitHub Pages\n\n1. Sukurkite saugyklą, pvz. spic-demo.\n2. Išarchyvuokite ZIP. Į pagrindinį saugyklos katalogą įkelkite index.html, .nojekyll ir README.md.\n3. Settings → Pages → Deploy from a branch.\n4. Pasirinkite main ir /(root), išsaugokite.\n5. Puslapio adresas bus parodytas Pages nustatymuose.\n\n## Demonstracija\n\nApžvalga → Darbuotojo diena → išjungti ryšį → pradėti vizitą → veiklos → užbaigti → pasirašyti → įjungti ryšį → Ataskaitos → Demo aptarimas.\n\nGalima kurti savaitinius pasikartojančius vizitus, keisti darbuotoją, perkelti ar pažymėti neįvykusį vizitą, redaguoti gavėjų planus ir eksportuoti ataskaitas bei susitikimo sprendimus.\n\nTransportas yra galimo kito etapo demonstracija ir neįtraukiamas į vizitų valandas.\n\n## Ribos\n\nIšgalvoti duomenys. Vietinis naršyklės saugojimas. Ryšio perjungimas ir sinchronizavimas imituojami, serverio nėra. Atidarytas puslapis veikia be išorinių priklausomybių; pakartotinis svetainės užkrovimas be interneto negarantuojamas. Atsisiųstą index.html galima atverti tiesiogiai kompiuteryje.\n\nNėra tikros autentifikacijos, serverio prieigos kontrolės, nekintamo audito, atsarginių kopijų ar teisinės parašo atitikties įgyvendinimo. Nenaudoti tikriems asmens duomenims.\n\nCSV atidaromas su Excel. PDF – naršyklės spausdinimo lange.\n\nPlanas yra vienas dabartinis mėnesinis limitas; istorinių plano versijų apskaita šiame prototipe neįgyvendinta.\n"]
];
const enc=new TextEncoder(),chunks=[],central=[];let offset=0;
const table=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0;});
const crc=bytes=>{let c=0xffffffff;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0;};
function block(n){const bytes=new Uint8Array(n);return [bytes,new DataView(bytes.buffer)];}
for(const [name,text]of files){
const n=enc.encode(name),data=enc.encode(text),sum=crc(data);
const [local,l]=block(30);l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,33,true);l.setUint32(14,sum,true);l.setUint32(18,data.length,true);l.setUint32(22,data.length,true);l.setUint16(26,n.length,true);
chunks.push(local,n,data);
const [entry,c]=block(46);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,33,true);c.setUint32(16,sum,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,n.length,true);c.setUint32(42,offset,true);central.push(entry,n);
offset+=local.length+n.length+data.length;
}
const size=central.reduce((a,b)=>a+b.length,0),[end,e]=block(22);
e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);
download("SPIC-GitHub-Pages.zip",new Blob([...chunks,...central,end]),"application/zip");
}
setInterval(()=>{
if(!selected)return;const v=S.visits.find(x=>x.id===selected),el=$("#elapsed");
if(v?.start&&!v.end&&el){const s=Math.max(0,Math.floor((Date.now()-new Date(v.start))/1000));el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
},1000);
render();
if(backupPending)msg("Naršyklė riboja vietinį saugojimą. Pakeitimus galite išsaugoti atsisiųsdami HTML.");
})();
